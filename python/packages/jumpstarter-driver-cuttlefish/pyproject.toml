[project]
name = "jumpstarter-driver-cuttlefish"
dynamic = ["version", "urls"]
description = "Cuttlefish Host Orchestrator driver for CVD lifecycle management"
license = "Apache-2.0"
authors = [{ name = "Benny Zlotnik", email = "bzlotnik@redhat.com" }]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0.0",
    "click>=8.0.0",
    "httpx>=0.27.0",
    "jumpstarter",
    "jumpstarter-driver-adb",
    "jumpstarter-driver-composite",
    "jumpstarter-driver-power",
    "requests>=2.28.0",
]

[project.entry-points."jumpstarter.drivers"]
Cuttlefish = "jumpstarter_driver_cuttlefish.driver:Cuttlefish"

[tool.hatch.version]
source = "vcs"
raw-options = { 'root' = '../../../' }

[tool.hatch.metadata.hooks.vcs.urls]
Homepage = "https://jumpstarter.dev"
source_archive = "https://github.com/jumpstarter-dev/repo/archive/{commit_hash}.zip"

[tool.pytest.ini_options]
addopts = "--cov=jumpstarter_driver_cuttlefish --cov-report=html --cov-report=xml"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["jumpstarter_driver_cuttlefish"]

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-pin-jumpstarter"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-cov>=6.0.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "requests-mock>=1.12.0",
]

[tool.hatch.build.hooks.pin_jumpstarter]
name = "pin_jumpstarter"
