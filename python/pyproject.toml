[dependency-groups]
docs = [
    "sphinx<9.1.1",
    "myst-parser>=5.0.0",
    "sphinxcontrib-mermaid>=2.0.1",
    "furo>=2024.8.6",
    "esbonio>=0.16.4",
    "sphinx-autobuild>=2024.4.16",
    "sphinx-click>=6.0.0",
    "sphinx-substitution-extensions>=2024.10.17",
    "requests>=2.33.1",
    "sphinxcontrib-programoutput>=0.19",
    "sphinx-copybutton>=0.5.2",
    "sphinx-inline-tabs>=2023.4.21",
    "pyyaml>=6.0",
]
dev = [
    "ruff==0.16.6",
    "typos>=1.23.6",
    "pre-commit>=3.8.0",
    "esbonio>=0.16.5",
    "ty>=0.0.1a8",
    "diff-cover>=10.2.0",
]

[tool.ruff]
target-version = "py311"
exclude = ["packages/jumpstarter-protocol"]
line-length = 120

[tool.ruff.lint]
exclude = ["packages/jumpstarter-protocol"]
extend-select = ["I", "C", "E", "F", "W", "B", "ERA"]

[tool.ruff.lint.isort]
known-local-folder = ["packages", "examples", "jumpstarter"]


[tool.typos.default]
locale = "en-us"

[tool.typos.default.extend-words]
ser = "ser"
Pn = "Pn"
mosquitto = "mosquitto"

[tool.coverage.run]
branch = true
omit = ["conftest.py", "test_*.py", "*_test.py", "*_pb2.py", "*_pb2_grpc.py"]
skip_empty = true

[tool.pytest.ini_options]
addopts = "--capture=no --doctest-modules --cov=. --cov-report=html --cov-report=xml"

[tool.hatch.version]
source = "vcs"
