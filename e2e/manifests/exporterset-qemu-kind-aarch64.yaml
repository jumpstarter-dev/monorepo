# Sample VirtualTargetClass + ExporterSet for exporterset-qemu e2e (aarch64).
#
# Kind/TCG friendly (no KVM). Applied by e2e/test/exporterset_qemu_test.go
# when the host arch is aarch64/arm64 (see e2e/scripts/qemu-guest-arch.sh).
# Images default to locally loaded :latest tags used by Kind e2e setup.
---
apiVersion: virtualtarget.jumpstarter.dev/v1alpha1
kind: VirtualTargetClass
metadata:
  name: qemu-aarch64-e2e
  namespace: jumpstarter-lab
spec:
  provisioner: qemu.jumpstarter.dev
  bindingMode: Immediate
  reclaimPolicy: Delete
  scheduling:
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
  images:
    exporter:
      image: quay.io/jumpstarter-dev/jumpstarter:latest
      imagePullPolicy: IfNotPresent
    runtime:
      image: quay.io/jumpstarter-dev/virtual/qemu-runtime:latest
      imagePullPolicy: IfNotPresent
  parameters:
    arch: aarch64
    machineType: virt
    resources:
      cpu: 1
      memory: 1Gi
    storage:
      size: 10Gi
      fsOverhead: "10%"
---
apiVersion: virtualtarget.jumpstarter.dev/v1alpha1
kind: ExporterSet
metadata:
  name: aarch64-virtual-e2e
  namespace: jumpstarter-lab
spec:
  minReplicas: 0
  maxReplicas: 1
  minAvailableReplicas: 1
  scaleDownCooldown: 5m
  recycleStrategy: ExitAndReplace
  virtualTargetClassName: qemu-aarch64-e2e
  selector:
    matchLabels:
      board: aarch64-virtual-e2e
  template:
    metadata:
      labels:
        board: aarch64-virtual-e2e
        arch: aarch64
        virtual: "true"
    spec:
      drivers:
        - name: qemu
          type: jumpstarter_driver_qemu.driver.Qemu
          config:
            arch: aarch64
            smp: 1
            mem: 1G
            disk_size: 10G
