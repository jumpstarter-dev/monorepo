apiVersion: jumpstarter.dev/v1alpha1
kind: ExporterConfig
metadata:
  name: test-exporter-dut-network-filter
  namespace: default
export:
  dut-network:
    type: jumpstarter_driver_dut_network.driver.DutNetwork
    config:
      interface: "jmp-vhost"
      subnet: "192.168.200.0/24"
      gateway_ip: "192.168.200.1"
      upstream_interface: "jmp-vup"
      nat_mode: "masquerade"
      dhcp_enabled: true
      dhcp_range_start: "192.168.200.100"
      dhcp_range_end: "192.168.200.200"
      addresses:
        - mac: "02:00:00:00:00:01"
          ip: "192.168.200.10"
          hostname: "test-dut"
      dns_servers: ["8.8.8.8"]
      state_dir: "/tmp/jmp-e2e-dut-network-filter"
      filter:
        egress:
          policy: drop
          rules:
            # Allow only the blocked-check port (9997) to a specific
            # destination, and deny everything else.  The E2E test verifies
            # that traffic to a non-allowed destination (port 9998) is dropped.
            - action: accept
              destination: "10.99.0.1/32"
              port: 9997
              protocol: tcp
